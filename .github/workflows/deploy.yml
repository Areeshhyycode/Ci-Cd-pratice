# ============================================
# CI/CD PIPELINE - GitHub Actions
# ============================================
# Yeh file GitHub ko batati hai:
# "Jab bhi code push ho, yeh steps follow karo"

# Pipeline ka naam
name: Build and Deploy Website

# TRIGGER: Kab chalegi yeh pipeline?
on:
  push:
    branches:
      - main    # Jab bhi "main" branch pe code push hoga

# JOBS: Kya kya kaam karna hai?
jobs:
  build-and-push:
    # Kis machine pe chalega? (GitHub free mein deta hai)
    runs-on: ubuntu-latest

    # STEPS: Ek ek step
    steps:
      # Step 1: Code download karo GitHub se
      - name: Checkout Code
        uses: actions/checkout@v4
        # Yeh action tumhara code GitHub server pe download karta hai

      # Step 2: Docker Hub mein login karo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          # Secrets = hidden passwords (GitHub Settings mein set karoge)

      # Step 3: Docker image build karo
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-cicd-website:latest .
        # Same command jo humne locally chalaya tha!

      # Step 4: Docker Hub pe push karo (upload)
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-cicd-website:latest
        # Ab duniya mein koi bhi tumhari image download kar sakta hai

      # Step 5: Success message
      - name: Deployment Success
        run: echo "✅ Website successfully built and pushed to Docker Hub!"
